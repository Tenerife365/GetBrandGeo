    <title>BrandGEO — Dashboard</title>

    <!-- Deliberate typeface (DASHBOARD-UX-2026.md §8) — the app previously had
         zero font-family customization and rendered on whatever system-UI stack
         the OS happened to supply. Inter is the dominant premium-SaaS typeface
         (Linear, Attio, Vercel); loaded as a variable font via Google Fonts with
         preconnect so it doesn't block first paint. Auth-gated internal app with
         no SEO/indexing concern, so a CDN link is the right tradeoff over
         self-hosting — ships today, no bundler config. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- askmywebsiteai — in-dashboard support assistant, added 2026-07-29.
         Placed before </body> rather than in <head>, and marked async, so a slow
         or unreachable vendor cannot delay first paint of the app itself. The
         keys are publishable by design (app id + pk_live), meant to sit in
         client code, so they are not a secret and this repo being public does
         not change that.

         REQUIRES the CSP allowances in netlify.toml. Without them the browser
         blocks this file before a line of it executes and the only symptom is a
         console message. If this widget ever stops appearing, check the CSP
         first, not the vendor.

         It loads on EVERY route including the login screen, so it is present
         for signed-out visitors and for admins as well as customers. That is
         the vendor's supported install and the simplest thing that works; gate
         it behind auth from React if that turns out to matter. -->
    <script
      async
      src="https://app.askmywebsiteai.com/sdk.js"
      data-app-id="app_a16a65082c9e13c7"
      data-public-key="pk_live_352f98333e403138c8f2a64432ffe776">
    </script>
  </body>
</html>
