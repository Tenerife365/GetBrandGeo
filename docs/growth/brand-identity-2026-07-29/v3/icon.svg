<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BrandGEO">
  <title>BrandGEO</title>
  <defs>
    <linearGradient id="bgGradCard" gradientUnits="userSpaceOnUse"
                    x1="150" y1="120" x2="362" y2="392">
      <stop offset="0"    stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1"    stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="#0B0C10"/>

  <!-- Mark scaled to 0.83 about the card centre. Keeps a 44px optical margin
       inside the corner radius, which is what stops the glyph fouling the
       rounding at 16px. -->
  <g transform="translate(43.5 43.5) scale(0.83)">
    <g fill="none" stroke="url(#bgGradCard)" stroke-width="56" stroke-linecap="round">
      <path d="M156 116V388"/>
      <circle cx="272" cy="304" r="84"/>
    </g>
    <circle cx="272" cy="304" r="28" fill="url(#bgGradCard)"/>
  </g>
</svg>
