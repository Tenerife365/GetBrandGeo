# Dashboard CI: tests, then the deploy-lag check, then one email on failure.
# Binding design: docs/arch/observability.md sections 4 (failures 3 and 4),
# 10 (F15 hardening) and 14. Operator steps: docs/ops/alerting-runbook.md.
#
# Hardening, all binding (F15):
#   - the only trigger is a push to main; no pull_request, pull_request_target
#     or workflow_run trigger, so no fork can run this with a secret
#   - top-level permissions: contents: read
#   - RESEND_API_KEY and ALERT_EMAIL appear only in the env of the final mail
#     step, which runs on failure; no third-party action receives a secret
#
# GitHub secrets read: RESEND_API_KEY, ALERT_EMAIL (names only, set by
# Constantin in the repository settings, runbook step 6).

name: dashboard-ci

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out (full history, for the ancestor check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22 (matches netlify.toml NODE_VERSION)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dashboard dependencies
        working-directory: brandgeo-dashboard
        run: npm ci --no-audit --no-fund

      # Failure 4: the suite was red for a month and nobody ran it. Every
      # tests/*.test.js runs; one red file fails the step after all have run.
      - name: Run every tests/*.test.js
        id: tests
        working-directory: brandgeo-dashboard
        run: |
          failed=""
          count=0
          for f in tests/*.test.js; do
            count=$((count + 1))
            echo "::group::$f"
            if node "$f"; then
              echo "PASS $f"
            else
              echo "FAIL $f"
              failed="$failed $f"
            fi
            echo "::endgroup::"
          done
          echo "ran $count test files"
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            echo "failed_tests=$failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # Failure 3: a dashboard push built ten days late, and one was cancelled
      # as "no content change". The live health.js reports the commit Netlify
      # built. The target is the newest commit that touched brandgeo-dashboard/;
      # a push that touches nothing there is cancelled by netlify.toml's ignore
      # on purpose, and its target is the older commit that is already live.
      # Accepted: live commit equals the target, or the target is an ancestor
      # of the live commit (a newer build already landed). Runs whether or not
      # the tests passed, so one email can report both.
      - name: Deploy-lag check against the live health endpoint
        id: deploylag
        if: success() || failure()
        run: |
          target="$(git log -1 --format=%H -- brandgeo-dashboard/)"
          echo "target commit (newest touching brandgeo-dashboard/): $target"
          url="https://app.getbrandgeo.com/.netlify/functions/health"
          deadline=$(( $(date +%s) + 1200 ))
          live=""
          while :; do
            body="$(curl -s --max-time 15 "$url" || true)"
            live="$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(typeof j.commit==="string"?j.commit:"")}catch(e){}})')"
            echo "live commit: ${live:-none}"
            if [ -n "$live" ]; then
              if [ "$live" = "$target" ]; then
                echo "deploy current"
                exit 0
              fi
              if git cat-file -e "$live^{commit}" 2>/dev/null && git merge-base --is-ancestor "$target" "$live"; then
                echo "deploy current (live is a descendant of the target)"
                exit 0
              fi
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "deploy lag: live ${live:-none} has not reached $target after 20 minutes"
              echo "live_commit=${live:-none}" >> "$GITHUB_OUTPUT"
              echo "target_commit=$target" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            sleep 60
          done

      # One email per failing run. The only step that sees a secret, and it
      # runs no third-party action.
      - name: Email the failure through Resend
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          FAILED_TESTS: ${{ steps.tests.outputs.failed_tests }}
          DEPLOY_OUTCOME: ${{ steps.deploylag.outcome }}
          LIVE_COMMIT: ${{ steps.deploylag.outputs.live_commit }}
          TARGET_COMMIT: ${{ steps.deploylag.outputs.target_commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL" ]; then
            echo "RESEND_API_KEY or ALERT_EMAIL is not set as a repository secret; no email sent"
            exit 1
          fi
          payload="$(node -e '
            const e = process.env
            const lines = [
              "Dashboard CI failed for push " + e.PUSHED_SHA + ".",
              "Tests: " + (e.TESTS_OUTCOME || "not run") + (e.FAILED_TESTS ? " (failed:" + e.FAILED_TESTS + ")" : ""),
              "Deploy lag: " + (e.DEPLOY_OUTCOME || "not run") + (e.TARGET_COMMIT ? " (live " + e.LIVE_COMMIT + ", expected " + e.TARGET_COMMIT + ")" : ""),
              "Run: " + e.RUN_URL,
              "",
              "Runbook: docs/ops/alerting-runbook.md",
            ]
            process.stdout.write(JSON.stringify({
              from: "BrandGEO <noreply@mail.getbrandgeo.com>",
              to: [e.ALERT_EMAIL],
              subject: "[BrandGEO alert] dashboard CI failed",
              text: lines.join("\n"),
            }))
          ')"
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload")"
          echo "Resend answered HTTP $code"
          case "$code" in 2*) ;; *) exit 1 ;; esac
